plugins {
    id 'dev.desiderium.retro.loom'
    id 'maven-publish'
}
group = providers.gradleProperty('mod_group').get()

def modId = providers.gradleProperty('mod_id').get()
def modName = providers.gradleProperty('mod_name').get()
base.archivesName = "${modId}-retrospectum-1.6.4"

def generatedConstants = layout.buildDirectory.dir('generated/sources/modConstants/java')
def generateModConstants = tasks.register('generateModConstants') {
    def values = [MOD_ID: modId, MOD_NAME: modName, MOD_VERSION: project.version.toString()]
    inputs.properties(values)
    outputs.dir(generatedConstants)
    doLast {
        def output = generatedConstants.get().file('io/github/vulpesstella/iaspis/BuildConstants.java').asFile
        output.parentFile.mkdirs()
        def fields = values.collect { key, value ->
            "    public static final String ${key} = ${groovy.json.JsonOutput.toJson(value)};"
        }.join('\n')
        output.setText("package io.github.vulpesstella.iaspis;\n\npublic final class BuildConstants {\n${fields}\n    private BuildConstants() {}\n}\n", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generateModConstants)

tasks.named('processResources', ProcessResources) {
    def modInfo = [
        mod_id: modId,
        mod_name: modName,
        mod_version: project.version.toString(),
        mod_description: providers.gradleProperty('mod_description').getOrElse(''),
        mod_authors: providers.gradleProperty('mod_authors').getOrElse('').split(',').collect { it.trim() }.findAll { it },
        mod_url: providers.gradleProperty('mod_url').getOrElse(''),
        mod_credits: providers.gradleProperty('mod_credits').getOrElse('')
    ].collectEntries { key, value -> [(key): groovy.json.JsonOutput.toJson(value)] }
    inputs.property('modInfo', modInfo)
    filesMatching('mcmod.info') { expand(modInfo) }
}

def withIc2 = providers.gradleProperty('withIc2').map { it.toBoolean() }.getOrElse(false)
if (withIc2) {
    def ic2Distribution = configurations.create('ic2Distribution') {
        canBeConsumed = false
        transitive = false
    }
    // Loom changes the signed class bytes when it remaps this distribution.
    def prepareIc2 = tasks.register('prepareIc2', Zip) {
        archiveFileName = 'industrialcraft-2_2.0.397-experimental.jar'
        destinationDirectory = layout.buildDirectory.dir('ic2')
        from { zipTree(ic2Distribution.singleFile) }
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC', 'META-INF/SIG-*'
    }
    dependencies {
        add(ic2Distribution.name, 'curse.maven:industrial-craft-242638:6657899')
        modRuntimeOnly files(prepareIc2)
        // IC2's energy network needs the legacy Matrix64F API.
        runtimeOnly 'com.googlecode.efficient-java-matrix-library:ejml:0.23'
    }
}

repositories {
    maven {
        url = uri(providers.gradleProperty('retrospectumMavenUrl').getOrElse('https://maven.desiderium.dev/releases/'))
        content { includeGroup 'dev.desiderium.retro' }
    }
    if (withIc2) {
        mavenCentral {
            content { includeModule 'com.googlecode.efficient-java-matrix-library', 'ejml' }
        }
        maven {
            url = uri('https://cursemaven.com')
            content { includeModule 'curse.maven', 'industrial-craft-242638' }
        }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.6.4'
    forge 'net.minecraftforge:forge:1.6.4-9.11.1.1345:universal'
    mappings 'net.minecraftforge:forge:1.6.4-9.11.1.1345:src@zip'
    // Loom's development launcher includes the tweaker even without a mixin configuration.
    def bootstrap = providers.gradleProperty('mixin_bootstrap').orNull
    def checkout = providers.gradleProperty('retrospectumMixinCheckout').orNull
    def runtimeVersion = providers.gradleProperty('mixin_version').get()
    if (checkout) {
        mixinBootstrap files("${checkout}/runtime/mixin-bootstrap/build/libs/retrospectum-mixin-${runtimeVersion}.jar")
    } else if (bootstrap) {
        mixinBootstrap files(bootstrap)
    } else {
        mixinBootstrap "dev.desiderium.retro:retrospectum-mixin:${runtimeVersion}"
    }
}

// Java variants expose the SRG release archive; dependency scopes follow Gradle conventions.
publishing {
    publications {
        mod(MavenPublication) { from components.java }
    }
}
