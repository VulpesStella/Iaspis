name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure build JDKs
        run: bash ./setup.sh
      - uses: gradle/actions/setup-gradle@v6
      - name: Build mod
        run: bash ./build.sh --no-daemon --console=plain clean build
      - name: Upload distributable mod
        uses: actions/upload-artifact@v6
        with:
          name: mod-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7
